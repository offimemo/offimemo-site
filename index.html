<!DOCTYPE html>
<html lang="fr">
  <head>
    <!-- Restaure la vraie URL après un aller-retour par public/404.html (GitHub
         Pages n'a pas de réécriture serveur pour une SPA React Router) — doit
         s'exécuter avant tout le reste, en particulier avant src/main.jsx. -->
    <script src="/spa-redirect.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%238FBCA4'/%3E%3Crect x='19' y='9' width='10' height='30' rx='5' fill='%230F2A1E'/%3E%3Crect x='9' y='19' width='30' height='10' rx='5' fill='%230F2A1E'/%3E%3C/svg%3E" />
    <!-- GitHub Pages ne permet pas de configurer les en-têtes HTTP (pas de vrai
         X-Frame-Options/HSTS possible) : cette CSP via <meta> est le seul filet
         disponible. script-src 'self' bloque l'exécution de tout <script> injecté
         (le vecteur XSS classique) ; connect-src limite les fetch/XHR au seul vrai
         backend, ce qui empêche l'exfiltration de données même en cas de XSS. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.offimemo.fr http://localhost:3000 https://api.github.com; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>OffiMemo : le bon conseil, à chaque scan</title>
    <meta
      name="description"
      content="OffiMemo affiche au comptoir, par-dessus votre LGO, le rappel de posologie, les modalités de prise et le conseil associé du médicament scanné."
    />
    <meta name="theme-color" content="#0F2A1E" />
    <meta property="og:title" content="OffiMemo : le bon conseil, à chaque scan" />
    <meta
      property="og:description"
      content="Le rappel de posologie et le conseil associé du médicament scanné, affichés par-dessus votre LGO. Rédigé et validé à la main par notre équipe."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://offimemo.fr" />
    <meta property="og:image" content="https://offimemo.fr/og.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@700&family=Outfit:wght@400&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-XDdAPQ90.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BPPz0lbN.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
